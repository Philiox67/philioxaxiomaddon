plugins {
    id 'fabric-loom' version '1.17.21'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    runs {
        client {
            // Writes the transformed Axiom classes to run/.mixin.out for checking the injections
            vmArg "-Dmixin.debug.export=true"
        }
    }
}

repositories {
    // Axiom jar from libs/, never bundled into our jar
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Axiom needs Fabric API, and some Axiom classes extend Fabric API types
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modCompileOnly "axiom:axiom:${project.axiom_version}"
    // Nested inside the Axiom jar (META-INF/jars/axiomclientapi.jar), needed for Axiom's region types
    modCompileOnly "axiom:axiomclientapi:${project.axiom_version}"
    modLocalRuntime "axiom:axiom:${project.axiom_version}"
    // Loom does not load Axiom's nested jars in dev, so runClient needs them separately
    modLocalRuntime "axiom:axiomclientapi:${project.axiom_version}"
    modLocalRuntime "axiom:mixinconstraints:1.0.9"
    modLocalRuntime "axiom:lattice:1.3.0"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
